name: Build macOS Library

# When to run this workflow
on:
  push:
    branches:
      - 'build-binaries-*'      # Auto-run on any branch named build-binaries-*
  workflow_dispatch:            # Also allow manual trigger from GitHub UI

jobs:
  build:
    runs-on: macos-latest       # GitHub provides actual macOS machine

    steps:
      # Step 1: Get your code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Build the library
      - name: Build pstalgo
        run: |
          cd pstalgo
          mkdir build
          cd build
          cmake ..
          make

      # Step 3: Verify build output
      - name: Check output
        run: |
          ls -lh pstalgo/bin/
          file pstalgo/bin/libpstalgo.dylib

      # Step 4: Run the pstalgo test suite against the built library
      - name: Run pstalgo tests
        run: |
          cd pstalgo/test
          python3 main.py 2>&1 | tee test-output.txt
          grep -q "^OK" test-output.txt

      # Step 5: Save the .dylib for download
      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: libpstalgo-macos
          path: pstalgo/bin/libpstalgo.dylib
          retention-days: 90     # Keep for 90 days
